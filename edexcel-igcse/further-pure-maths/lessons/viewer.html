<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson - GCSE Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../styles.css">
    <link rel="stylesheet" href="lesson.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script type="module">import 'https://unpkg.com/mathlive@0.101.0?module';</script>
</head>
<body>
    <div class="grain"></div>

    <nav class="nav">
        <a href="../../../" class="nav-brand">
            <span class="brand-mark">//</span> GCSE Hub
        </a>
        <div class="nav-links">
            <a href="../../../" class="nav-link">Boards</a>
            <a href="../../" class="nav-link">Edexcel iGCSE</a>
            <a href="../" class="nav-link">FPM</a>
        </div>
        <div class="nav-auth">
            <span id="auth-info"></span>
            <button class="auth-btn" id="auth-btn">Sign in</button>
        </div>
    </nav>

    <!-- Progress bar -->
    <div class="lesson-progress">
        <div class="lesson-progress-fill" id="progress-fill"></div>
    </div>

    <main class="container">
        <header class="lesson-header">
            <a href="../" class="back-link">&larr; Further Pure Maths</a>
            <div class="screen-counter" id="screen-counter">1 / 1</div>
            <h1 class="lesson-title" id="lesson-title">Loading...</h1>
            <p class="lesson-subtitle" id="lesson-subtitle"></p>
        </header>

        <div class="lesson-content" id="lesson-content">
            <!-- Screens rendered here by LessonEngine -->
        </div>

        <div class="lesson-nav" id="lesson-nav">
            <button class="btn-prev" id="btn-prev" disabled>Previous</button>
            <button class="btn-next" id="btn-next">Next</button>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 GCSE Hub. Not affiliated with Pearson Edexcel.</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="../../../js/firebase-config.js"></script>
    <script src="../../../js/tracker.js"></script>
    <script src="../../../js/auth.js"></script>
    <script src="lesson-engine.js"></script>
    <script>
        Auth.init();

        (function () {
            const params = new URLSearchParams(window.location.search);
            const lessonId = params.get('lesson');
            if (!lessonId) {
                document.getElementById('lesson-title').textContent = 'No lesson specified';
                document.getElementById('lesson-content').innerHTML =
                    '<p style="color:var(--text-secondary)">Add <code>?lesson=lesson-id</code> to the URL to load a lesson.</p>';
                return;
            }

            // Set page title
            document.title = lessonId.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) + ' - GCSE Hub';

            // Dynamically load lesson data file
            const script = document.createElement('script');
            script.src = 'data/' + encodeURIComponent(lessonId) + '.js';
            script.onload = function () {
                if (window.CURRENT_LESSON) {
                    LessonEngine.start(window.CURRENT_LESSON, lessonId);
                } else {
                    document.getElementById('lesson-title').textContent = 'Lesson data not found';
                }
            };
            script.onerror = function () {
                document.getElementById('lesson-title').textContent = 'Lesson not found';
                document.getElementById('lesson-content').innerHTML =
                    '<p style="color:var(--text-secondary)">Could not load lesson file: <code>' + lessonId + '</code></p>';
            };
            document.body.appendChild(script);
        })();
    </script>
</body>
</html>
