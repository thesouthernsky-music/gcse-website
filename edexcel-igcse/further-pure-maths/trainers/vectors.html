<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vectors - GCSE Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../styles.css">
    <link rel="stylesheet" href="trainer.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script type="module">import 'https://unpkg.com/mathlive@0.101.0?module';</script>
</head>
<body>
    <div class="grain"></div>

    <nav class="nav">
        <a href="../../../" class="nav-brand">
            <span class="brand-mark">//</span> GCSE Hub
        </a>
        <div class="nav-links">
            <a href="../../../" class="nav-link">Boards</a>
            <a href="../../" class="nav-link">Edexcel iGCSE</a>
            <a href="../" class="nav-link">FPM</a>
        </div>
        <div class="nav-auth">
            <span id="auth-info"></span>
            <button class="auth-btn" id="auth-btn">Sign in</button>
        </div>
    </nav>

    <main class="container">
        <header class="trainer-header">
            <a href="../" class="back-link">&larr; Further Pure Maths</a>
            <div class="trainer-title-row">
                <div>
                    <p class="hero-tag">Topic 07</p>
                    <h1 class="trainer-title">Vectors</h1>
                </div>
                <div class="score-display">
                    <span class="score-correct" id="score-correct">0</span>
                    <span class="score-sep">/</span>
                    <span class="score-total" id="score-total">0</span>
                </div>
            </div>
        </header>

        <!-- Subtopic selector -->
        <div class="subtopic-bar" id="subtopic-bar">
            <button class="subtopic-btn active" data-topic="all">All</button>
            <button class="subtopic-btn" data-topic="operations">Vector Operations</button>
            <button class="subtopic-btn" data-topic="position">Position Vectors</button>
            <button class="subtopic-btn" data-topic="magnitude">Magnitude</button>
            <button class="subtopic-btn" data-topic="unit-vectors">Unit Vectors</button>
            <button class="subtopic-btn" data-topic="proofs">Geometric Proofs</button>
        </div>

        <!-- Question area -->
        <div class="question-area" id="question-area">
            <div class="question-card">
                <div class="question-type" id="question-type">Loading...</div>
                <div class="question-text" id="question-text"></div>
                <div class="answer-section" id="answer-section"></div>
                <div class="feedback" id="feedback"></div>
                <div class="hint-section">
                    <button class="hint-btn" id="hint-btn">Show hint</button>
                    <div class="hint-text" id="hint-text"></div>
                </div>
            </div>
        </div>

        <!-- Working out -->
        <details class="workout-section">
            <summary>Working Out</summary>
            <button class="copy-calc-btn" id="copy-calc-btn">&#128203; Copy Calculator to Workings</button>
            <div class="workout-content" id="workout-area" contenteditable="true"></div>
        </details>

        <!-- Keyboard hints -->
        <details class="kb-hints">
            <summary>Keyboard shortcuts</summary>
            <div class="kb-hints-grid">
                <div class="kb-hint"><kbd>/</kbd> Fraction</div>
                <div class="kb-hint"><kbd>^</kbd> Power / Exponent</div>
                <div class="kb-hint"><kbd>\sqrt</kbd> Square root</div>
                <div class="kb-hint"><kbd>_</kbd> Subscript</div>
                <div class="kb-hint"><kbd>( )</kbd> Brackets</div>
                <div class="kb-hint"><kbd>Enter</kbd> Submit / Next</div>
            </div>
        </details>

        <!-- Streak bar -->
        <div class="streak-bar">
            <div class="streak-dots" id="streak-dots"></div>
            <span class="streak-label" id="streak-label">Streak: 0</span>
        </div>
    </main>

    <!-- Calculator -->
    <button class="calc-btn" id="calc-btn" title="Calculator">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="2"></rect>
            <line x1="8" y1="6" x2="16" y2="6"></line>
            <line x1="8" y1="10" x2="8" y2="10.01"></line>
            <line x1="12" y1="10" x2="12" y2="10.01"></line>
            <line x1="16" y1="10" x2="16" y2="10.01"></line>
            <line x1="8" y1="14" x2="8" y2="14.01"></line>
            <line x1="12" y1="14" x2="12" y2="14.01"></line>
            <line x1="16" y1="14" x2="16" y2="14.01"></line>
            <line x1="8" y1="18" x2="8" y2="18.01"></line>
            <line x1="12" y1="18" x2="16" y2="18"></line>
        </svg>
    </button>
    <div class="calc-modal" id="calc-modal">
        <div class="calc-titlebar" id="calc-titlebar">
            <span>Calculator</span>
            <div class="calc-titlebar-actions">
                <button class="calc-deg-btn" id="calc-deg-btn" title="Toggle Degrees / Radians">DEG</button>
                <button class="calc-close-btn" id="calc-close-btn" aria-label="Close calculator">&times;</button>
            </div>
        </div>
        <div class="calc-container" id="calc-container"></div>
        <div class="calc-resize-handle" id="calc-resize-handle"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="../../../js/firebase-config.js"></script>
    <script src="../../../js/tracker.js"></script>
    <script src="../../../js/auth.js"></script>
    <script src="https://www.desmos.com/api/v1.9/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
    <script src="vectors.js"></script>
    <script src="../../../js/calculator.js"></script>
    <script>Auth.init();</script>
</body>
</html>
